# Uses the Soldered DS3234 RTC breakout board as a battery-backed time source. The system clock is set from the RTC
# on boot, and the RTC is updated whenever SNTP gets a fresh time over Wi-Fi. Also publishes the RTC's die
# temperature and fires alarm 1 once a minute (at second 00).

esphome:
  name: ds3234-basic
  on_boot:
    # Run after all components (including the RTC) have been set up.
    priority: -100
    then:
      - ds3234.set_alarm_1:
          id: rtc
          second: 0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

external_components:
  - source:
      type: local
      path: ../components
    components: [ds3234]

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

time:
  - platform: ds3234
    id: rtc
    cs_pin: GPIO10
    timezone: Europe/Zagreb
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zagreb
    on_time_sync:
      then:
        - ds3234.write_time: rtc

sensor:
  - platform: ds3234
    name: "RTC Temperature"

binary_sensor:
  - platform: ds3234
    alarm_1:
      name: "RTC Alarm 1"
      on_press:
        - logger.log: "DS3234 alarm 1 fired"
